name: 🧪 Run Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite tag (e.g. test:e2e)
        required: false
        default: test:e2e
        type: string
      browser:
        description: Browser to use
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      mode:
        description: Browser mode
        required: false
        default: headless
        type: choice
        options:
          - headless
          - headed

jobs:
  playwright:
    runs-on: ubuntu-latest

    env:
      CI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install Xvfb
        if: ${{ inputs.mode == 'headed' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🧪 Run Playwright Tests
        shell: bash
        env:
          TEST_SUITE: ${{ inputs.test_suite }}
          BROWSER: ${{ inputs.browser }}
          MODE: ${{ inputs.mode }}
        run: |
          SUITE="${TEST_SUITE:-test:e2e}"
          BROWSER="${BROWSER:-chromium}"
          MODE="${MODE:-headless}"

          TAG="${SUITE#test:}"

          if [ "$MODE" = "headed" ]; then
            xvfb-run --auto-servernum npx playwright test \
              --grep "@$TAG" \
              --project="$BROWSER" \
              --headed \
              --reporter=dot,html
          else
            npx playwright test \
              --grep "@$TAG" \
              --project="$BROWSER" \
              --reporter=dot,html
          fi

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          if-no-files-found: warn
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30
