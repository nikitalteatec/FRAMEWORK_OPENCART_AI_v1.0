name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite"
        required: false
        default: "test:e2e"
        type: choice
        options:
          - test:e2e
          - test:smoke
          - test:regression
      browser:
        description: "Browser"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      mode:
        description: "Test mode"
        required: false
        default: "headless"
        type: choice
        options:
          - headless
          - headed

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 🧪 Run Playwright Tests
        shell: pwsh
        run: |
          $suite = "${{ github.event.inputs.test_suite || 'test:e2e' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"

          $tag = $suite -replace '^test:', ''
          $browserFlag = "--project=$browser"

          $modeFlag = @()
          if ($mode -eq 'headed') {
            $modeFlag = @('--headed')
          }

          npx playwright test --grep "@$tag" $browserFlag @modeFlag --reporter=dot,html
        env:
          CI: "1"
        
      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          if-no-files-found: warn
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30
